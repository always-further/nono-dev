[project]
name = "nono-dev"
version = "0.1.0"
description = "Development environment manager for the nono project"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nono-dev = "nono_dev.cli:main"

[tool.setuptools.packages.find]
include = ["nono_dev*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
